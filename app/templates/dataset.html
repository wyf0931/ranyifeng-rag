<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集管理 - 科技爱好者周刊 RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="datasetApp()" x-cloak class="min-h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="book-open" class="w-8 h-8 text-blue-600"></i>
                        <h1 class="text-xl font-bold text-gray-900">科技爱好者周刊 RAG</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>搜索</span>
                        </a>
                        <a href="/dictionary" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="book" class="w-5 h-5"></i>
                            <span>词典</span>
                        </a>
                        <a href="/stopwords" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="filter" class="w-5 h-5"></i>
                            <span>停用词</span>
                        </a>
                        <a href="/admin" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span>设置</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-6">
            <!-- Page Title -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">数据集管理</h1>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <label class="text-sm font-medium text-gray-700">筛选条件:</label>
                        <div class="relative">
                            <select x-model="filters.section" @change="applyFilters"
                                class="h-9 px-3 pr-8 text-sm border border-gray-300 rounded-md bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none appearance-none cursor-pointer hover:bg-gray-50 transition-colors">
                                <option value="">全部版块</option>
                                <template x-for="section in sections" :key="section">
                                    <option :value="section" x-text="section"></option>
                                </template>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                                <svg class="h-4 w-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-sm text-gray-500">
                            共 <span x-text="filteredItems.length" class="font-semibold text-gray-900"></span> 条数据
                        </div>
                    </div>
                    <button @click="openImportDialog"
                            class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
                        URL 导入
                    </button>
                </div>
            </div>

            <!-- Items Table -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">标题</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">版块</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">描述</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="item in paginatedItems" :key="item.id">
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="px-6 py-4">
                                        <a :href="item.link" target="_blank" rel="noopener noreferrer"
                                           class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline"
                                           x-text="item.title">
                                        </a>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800"
                                              x-text="item.section_name">
                                        </span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="text-sm text-gray-600 max-w-md truncate"
                                             x-text="item.description || '-'"
                                             :title="item.description">
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button @click="viewItem(item)"
                                                class="inline-flex items-center px-3 py-1.5 text-xs font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                                            查看
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="bg-white px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                    <div class="text-sm text-gray-500">
                        显示 <span class="font-medium" x-text="(currentPage - 1) * pageSize + 1"></span>
                        到 <span class="font-medium" x-text="Math.min(currentPage * pageSize, filteredItems.length)"></span>
                        条，共 <span class="font-medium" x-text="filteredItems.length"></span> 条
                    </div>
                    <div class="flex items-center space-x-2">
                        <button @click="currentPage--" :disabled="currentPage === 1"
                                class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            上一页
                        </button>
                        <span class="text-sm text-gray-600" x-text="currentPage"></span>
                        <button @click="currentPage++" :disabled="currentPage * pageSize >= filteredItems.length"
                                class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            下一页
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Item Detail Dialog -->
        <div x-show="dialogOpen" x-transition class="fixed inset-0 z-50" style="display: none;">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/50" @click="closeDialog"></div>

            <!-- Dialog -->
            <div class="fixed z-50 bg-white rounded-lg shadow-xl flex flex-col border border-gray-200"
                 style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(600px, 90vw); max-height: 90vh;">
                <div class="p-6 overflow-y-auto">
                    <div class="mb-4">
                        <h2 class="text-lg font-semibold text-gray-900 mb-2" x-text="selectedItem?.title"></h2>
                        <div class="flex items-center space-x-2">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800"
                                  x-text="selectedItem?.section_name">
                            </span>
                            <span class="text-sm text-gray-500" x-text="'ID: ' + selectedItem?.id"></span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <h3 class="text-sm font-medium text-gray-700 mb-1">链接</h3>
                            <a :href="selectedItem?.link" target="_blank" rel="noopener noreferrer"
                               class="text-sm text-blue-600 hover:text-blue-800 hover:underline break-all"
                               x-text="selectedItem?.link">
                            </a>
                        </div>

                        <div>
                            <h3 class="text-sm font-medium text-gray-700 mb-1">描述</h3>
                            <div class="text-sm text-gray-600 bg-gray-50 rounded-md p-3 whitespace-pre-wrap"
                                 x-text="selectedItem?.description || '无描述'">
                            </div>
                        </div>

                        <div>
                            <h3 class="text-sm font-medium text-gray-700 mb-1">提交者</h3>
                            <div class="text-sm text-gray-600">
                                <template x-if="selectedItem?.user">
                                    <span>
                                        <span x-text="selectedItem?.user"></span>
                                        <a :href="selectedItem?.user_link" target="_blank" rel="noopener noreferrer"
                                           class="text-blue-600 hover:text-blue-800 hover:underline ml-2"
                                           x-show="selectedItem?.user_link"
                                           x-text="'(' + selectedItem?.user_link + ')'">
                                        </a>
                                    </span>
                                </template>
                                <template x-if="!selectedItem?.user">
                                    <span class="text-gray-400">无</span>
                                </template>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-sm font-medium text-gray-700 mb-3">图片</h3>
                            <div class="flex flex-wrap gap-3">
                                <template x-if="selectedItem?.images && selectedItem.images.length > 0">
                                    <template x-for="(image, index) in selectedItem.images" :key="index">
                                        <a :href="image" target="_blank" rel="noopener noreferrer"
                                           class="inline-block">
                                            <img :src="image" alt="Image" class="w-56 h-auto max-h-64 object-cover rounded-lg border border-gray-200 hover:opacity-90 transition-opacity shadow-sm">
                                        </a>
                                    </template>
                                </template>
                                <template x-if="!selectedItem?.images || selectedItem.images.length === 0">
                                    <span class="text-sm text-gray-400">无图片</span>
                                </template>
                            </div>
                        </div>

                        <div class="border-t border-gray-200 pt-4">
                            <h3 class="text-sm font-medium text-gray-700 mb-2">所属文章</h3>
                            <div class="bg-gray-50 rounded-md p-3 space-y-2">
                                <div>
                                    <span class="text-xs text-gray-500">标题</span>
                                    <a :href="selectedItem?.article_link" target="_blank" rel="noopener noreferrer"
                                       class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline block"
                                       x-text="selectedItem?.article_title">
                                    </a>
                                </div>
                                <div>
                                    <span class="text-xs text-gray-500">期号</span>
                                    <span class="text-sm text-gray-900 block" x-text="'第 ' + selectedItem?.article_number + ' 期'"></span>
                                </div>
                                <div>
                                    <span class="text-xs text-gray-500">链接</span>
                                    <a :href="selectedItem?.article_link" target="_blank" rel="noopener noreferrer"
                                       class="text-xs text-blue-600 hover:text-blue-800 hover:underline break-all block"
                                       x-text="selectedItem?.article_link">
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Close Button -->
                <button type="button" @click="closeDialog"
                        class="absolute top-4 right-4 rounded-sm text-gray-400 opacity-70 transition-all hover:opacity-100 hover:text-gray-600 focus:outline-none cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Footer -->
                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end p-6 border-t border-gray-200">
                    <button @click="closeDialog"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        关闭
                    </button>
                </div>
            </div>
        </div>

        <!-- URL Import Dialog -->
        <div x-show="importDialogOpen" x-transition class="fixed inset-0 z-50" style="display: none;">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/50" @click="closeImportDialog"></div>

            <!-- Dialog -->
            <div class="fixed z-50 bg-white rounded-lg shadow-xl flex flex-col border border-gray-200"
                 style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(600px, 90vw); max-height: 90vh;">
                <div class="p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">URL 导入</h2>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">请输入 URL（每行一个）</label>
                        <textarea x-model="importUrls"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none"
                                  rows="8"
                                  placeholder="https://example.com/article1&#10;https://example.com/article2&#10;https://example.com/article3"></textarea>
                        <p class="mt-2 text-xs text-gray-500">支持一次性输入多个 URL，每行一个。系统将在后台自动抓取并转换为 Markdown 格式。</p>
                    </div>

                    <!-- Import Status -->
                    <div x-show="importResult" class="mb-4 p-4 rounded-md" :class="importSuccess ? 'bg-green-50' : 'bg-red-50'">
                        <p class="text-sm font-medium" :class="importSuccess ? 'text-green-800' : 'text-red-800'" x-text="importResult"></p>
                    </div>
                </div>

                <!-- Close Button -->
                <button type="button" @click="closeImportDialog"
                        class="absolute top-4 right-4 rounded-sm text-gray-400 opacity-70 transition-all hover:opacity-100 hover:text-gray-600 focus:outline-none cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Footer -->
                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end p-6 border-t border-gray-200">
                    <button @click="closeImportDialog"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        取消
                    </button>
                    <button @click="submitUrls"
                            :disabled="importing || !importUrls.trim()"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        <span x-text="importing ? '处理中...' : '开始导入'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function datasetApp() {
            return {
                items: [],
                sections: [],
                filteredItems: [],
                filters: {
                    section: ''
                },
                currentPage: 1,
                pageSize: 20,
                dialogOpen: false,
                selectedItem: null,
                importDialogOpen: false,
                importUrls: '',
                importing: false,
                importResult: null,
                importSuccess: false,

                async init() {
                    await this.loadItems();
                    lucide.createIcons();
                },

                async loadItems() {
                    try {
                        const response = await fetch('/api/items');
                        this.items = await response.json();

                        // Extract unique sections
                        this.sections = [...new Set(this.items.map(item => item.section_name))].sort();
                        this.applyFilters();
                    } catch (error) {
                        console.error('Failed to load items:', error);
                    }
                },

                applyFilters() {
                    this.filteredItems = this.items.filter(item => {
                        if (this.filters.section && item.section_name !== this.filters.section) {
                            return false;
                        }
                        return true;
                    });
                    this.currentPage = 1;
                },

                get paginatedItems() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.filteredItems.slice(start, start + this.pageSize);
                },

                viewItem(item) {
                    this.selectedItem = item;
                    this.dialogOpen = true;
                },

                closeDialog() {
                    this.dialogOpen = false;
                    this.selectedItem = null;
                },

                openImportDialog() {
                    this.importDialogOpen = true;
                    this.importUrls = '';
                    this.importResult = null;
                },

                closeImportDialog() {
                    this.importDialogOpen = false;
                    this.importUrls = '';
                    this.importResult = null;
                },

                async submitUrls() {
                    if (!this.importUrls.trim()) return;

                    this.importing = true;
                    this.importResult = null;

                    try {
                        // Parse URLs (split by lines)
                        const urls = this.importUrls.split('\n')
                            .map(url => url.trim())
                            .filter(url => url.length > 0);

                        if (urls.length === 0) {
                            this.importResult = '请输入至少一个有效的 URL';
                            this.importSuccess = false;
                            return;
                        }

                        const response = await fetch('/api/import-urls', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ urls })
                        });

                        const result = await response.json();

                        if (response.ok) {
                            this.importResult = result.message || `成功提交 ${result.urls_count} 个 URL，正在后台处理中...`;
                            this.importSuccess = true;
                            this.importUrls = '';
                        } else {
                            this.importResult = result.error || '导入失败';
                            this.importSuccess = false;
                        }
                    } catch (error) {
                        this.importResult = '导入失败: ' + error.message;
                        this.importSuccess = false;
                    } finally {
                        this.importing = false;
                    }
                }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        // Close dialog on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const app = document.querySelector('[x-data]')._x_dataStack[0];
                if (app.dialogOpen) {
                    app.closeDialog();
                }
                if (app.importDialogOpen) {
                    app.closeImportDialog();
                }
            }
        });
    </script>
</body>
</html>
