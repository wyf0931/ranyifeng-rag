<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据集管理 - 科技爱好者周刊 RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .dialog-hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="datasetApp()" x-cloak class="min-h-screen">
        <!-- Header -->
        <header class="bg-gray-900 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="book-open" class="w-8 h-8 text-blue-400"></i>
                        <h1 class="text-xl font-bold text-white">科技爱好者周刊 RAG</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>搜索</span>
                        </a>
                        <a href="/dataset" class="text-blue-400 hover:text-blue-300 flex items-center space-x-1">
                            <i data-lucide="database" class="w-5 h-5"></i>
                            <span>数据集</span>
                        </a>
                        <a href="/articles" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                            <span>文章</span>
                        </a>
                        <a href="/dictionary" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="book" class="w-5 h-5"></i>
                            <span>词典</span>
                        </a>
                        <a href="/stopwords" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="filter" class="w-5 h-5"></i>
                            <span>停用词</span>
                        </a>
                        <a href="/section" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="layout-grid" class="w-5 h-5"></i>
                            <span>板块</span>
                        </a>
                        <a href="/admin" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span>设置</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-6">
            <!-- Page Title -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">数据集管理</h1>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                <div class="flex items-center space-x-4 flex-wrap gap-4">
                    <div class="flex items-center space-x-4 flex-1 min-w-0">
                        <label class="text-sm font-medium text-gray-700 whitespace-nowrap">搜索:</label>
                        <div class="relative flex-1 max-w-md">
                            <input type="text" x-model="filters.search" @input="onSearchInput" @keyup.enter="performSearch"
                                   placeholder="输入关键词搜索标题和描述..."
                                   class="w-full h-9 px-3 pr-10 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors placeholder:text-gray-400">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                                <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <label class="text-sm font-medium text-gray-700">版块:</label>
                        <div class="relative">
                            <select x-model="filters.section" @change="onSectionChange"
                                class="h-9 px-3 pr-8 text-sm border border-gray-300 rounded-md bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none appearance-none cursor-pointer hover:bg-gray-50 transition-colors">
                                <option value="">全部版块</option>
                                <template x-for="section in sections" :key="section">
                                    <option :value="section" x-text="section"></option>
                                </template>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                                <svg class="h-4 w-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
                <div x-show="isSearching" class="mt-3 text-sm text-gray-500 flex items-center space-x-2">
                    <span>搜索中...</span>
                </div>
                <div x-show="!isSearching && filters.search && searchResults !== null" class="mt-3 text-sm text-gray-600">
                    找到 <span class="font-medium text-blue-600" x-text="searchResults?.length"></span> 条结果
                </div>
            </div>

            <!-- Items Table -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">标题</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">版块</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">描述</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">创建时间</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="item in paginatedItems" :key="item.id">
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="px-6 py-4">
                                        <a :href="item.link" target="_blank" rel="noopener noreferrer"
                                           class="text-sm font-medium text-gray-900 hover:text-gray-700 hover:underline"
                                           x-text="item.title">
                                        </a>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800"
                                              x-text="item.section_name">
                                        </span>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="text-sm text-gray-600 max-w-md truncate"
                                             x-text="item.description || '-'"
                                             :title="item.description">
                                        </div>
                                    </td>
                                    <td class="px-6 py-4">
                                        <span class="text-sm text-gray-600" x-text="formatDateShort(item.created_at)"></span>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <div class="flex items-center justify-end space-x-2">
                                            <button @click="viewItem(item)"
                                                    class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-blue-100 hover:bg-blue-200 text-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                                                <i data-lucide="eye" class="w-4 h-4"></i>
                                            </button>
                                            <button @click="openEditDialog(item)"
                                                    class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-green-100 hover:bg-green-200 text-green-600 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                                            </button>
                                            <button @click="confirmDeleteItemFromList(item)"
                                                    class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-red-100 hover:bg-red-200 text-red-600 transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="bg-white px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                    <div class="text-sm text-gray-500">
                        显示 <span class="font-medium" x-text="(currentPage - 1) * pageSize + 1"></span>
                        到 <span class="font-medium" x-text="Math.min(currentPage * pageSize, filteredItems.length)"></span>
                        条，共 <span class="font-medium" x-text="filteredItems.length"></span> 条
                    </div>
                    <div class="flex items-center space-x-2">
                        <button @click="currentPage = 1" :disabled="currentPage === 1"
                                class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            首页
                        </button>
                        <button @click="currentPage--" :disabled="currentPage === 1"
                                class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            上一页
                        </button>
                        <template x-for="page in visiblePages">
                            <div class="inline-flex">
                                <span x-show="page === '...'" class="px-2 py-1 text-sm text-gray-500">...</span>
                                <button x-show="page !== '...'" x-cloak @click="currentPage = page"
                                        :class="currentPage === page
                                            ? 'px-3 py-1 text-sm bg-blue-500 text-white rounded-md'
                                            : 'px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 transition-colors'">
                                    <span x-text="page"></span>
                                </button>
                            </div>
                        </template>
                        <button @click="currentPage++" :disabled="currentPage * pageSize >= filteredItems.length"
                                class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            下一页
                        </button>
                        <button @click="currentPage = totalPages" :disabled="currentPage === totalPages"
                                class="px-3 py-1 text-sm border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            末页
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Item Detail Dialog -->
        <div :class="{ 'dialog-hidden': !dialogOpen, 'fixed inset-0 z-50': dialogOpen }">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/50 z-40" @click="closeDialog"></div>

            <!-- Dialog -->
            <div class="fixed z-50 bg-white rounded-lg shadow-xl border border-gray-200"
                 style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(600px, 90vw); max-height: 90vh;">
                <!-- Header -->
                <div class="pr-8 p-6 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900" x-text="selectedItem?.title"></h2>
                    <p class="text-sm text-gray-500 mt-1">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800 mr-2"
                              x-text="selectedItem?.section_name"></span>
                        ID: <span x-text="selectedItem?.id"></span>
                    </p>
                </div>

                <!-- Content -->
                <div class="p-6 overflow-y-auto flex flex-col gap-4" style="max-height: calc(90vh - 140px);">
                    <!-- Link -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">链接</label>
                        <a :href="selectedItem?.link" target="_blank" rel="noopener noreferrer"
                           class="text-sm text-blue-600 hover:text-blue-800 hover:underline break-all"
                           x-text="selectedItem?.link">
                        </a>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                        <div class="text-sm text-gray-600 bg-gray-50 rounded-lg p-3 whitespace-pre-wrap border border-gray-200"
                             x-text="selectedItem?.description || '无描述'">
                        </div>
                    </div>

                    <!-- User -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">提交者</label>
                        <div class="text-sm text-gray-600">
                            <template x-if="selectedItem?.user">
                                <span>
                                    <span x-text="selectedItem?.user"></span>
                                    <a :href="selectedItem?.user_link" target="_blank" rel="noopener noreferrer"
                                       class="text-blue-600 hover:text-blue-800 hover:underline ml-2"
                                       x-show="selectedItem?.user_link"
                                       x-text="'(' + selectedItem?.user_link + ')'">
                                    </a>
                                </span>
                            </template>
                            <template x-if="!selectedItem?.user">
                                <span class="text-gray-400">无</span>
                            </template>
                        </div>
                    </div>

                    <!-- Images -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">图片</label>
                        <div class="flex flex-wrap gap-3">
                            <template x-if="selectedItem?.images && selectedItem.images.length > 0">
                                <template x-for="(image, index) in selectedItem.images" :key="index">
                                    <a :href="image" target="_blank" rel="noopener noreferrer"
                                       class="inline-block">
                                        <img :src="image" alt="Image" class="w-56 h-auto max-h-64 object-cover rounded-lg border border-gray-200 hover:opacity-90 transition-opacity">
                                    </a>
                                </template>
                            </template>
                            <template x-if="!selectedItem?.images || selectedItem.images.length === 0">
                                <span class="text-sm text-gray-400">无图片</span>
                            </template>
                        </div>
                    </div>

                    <!-- Article Info -->
                    <div class="border-t border-gray-200 pt-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">所属文章</label>
                        <div class="bg-gray-50 rounded-lg p-3 space-y-2 border border-gray-200">
                            <div>
                                <span class="text-xs text-gray-500">标题</span>
                                <a :href="selectedItem?.article_link" target="_blank" rel="noopener noreferrer"
                                   class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline block"
                                   x-text="selectedItem?.article_title">
                                </a>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">期号</span>
                                <span class="text-sm text-gray-900 block" x-text="'第 ' + selectedItem?.article_number + ' 期'"></span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">链接</span>
                                <a :href="selectedItem?.article_link" target="_blank" rel="noopener noreferrer"
                                   class="text-xs text-blue-600 hover:text-blue-800 hover:underline break-all block"
                                   x-text="selectedItem?.article_link">
                                </a>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Close Button -->
                <button type="button" @click="closeDialog"
                        class="absolute top-4 right-4 rounded-sm text-gray-400 opacity-70 transition-all hover:opacity-100 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Footer -->
                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end p-6 border-t border-gray-200">
                    <button @click="closeDialog"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        关闭
                    </button>
                    <button @click="confirmDeleteItem"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>
                        删除
                    </button>
                </div>
            </div>
        </div>

        <!-- Edit Dialog -->
        <div :class="{ 'dialog-hidden': !editDialogOpen, 'fixed inset-0 z-50': editDialogOpen }">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/50 z-40" @click="closeEditDialog"></div>

            <!-- Dialog -->
            <div class="fixed z-50 bg-white rounded-lg shadow-xl border border-gray-200"
                 style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(500px, 90vw);">
                <!-- Header -->
                <div class="pr-8 p-6 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">编辑条目</h2>
                    <p class="text-sm text-gray-500 mt-1">修改条目的标题和板块</p>
                </div>

                <!-- Content -->
                <div class="p-6 flex flex-col gap-4">
                    <!-- Title -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">标题</label>
                        <input type="text"
                               x-model="newTitle"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                               placeholder="输入标题">
                    </div>

                    <!-- Current Section -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">当前板块</label>
                        <div class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-900" x-text="editingItem?.section_name"></div>
                    </div>

                    <!-- New Section -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">新板块</label>
                        <select x-model="newSection"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <template x-for="section in sections" :key="section">
                                <option :value="section" x-text="section"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Close Button -->
                <button type="button" @click="closeEditDialog"
                        class="absolute top-4 right-4 rounded-sm text-gray-400 opacity-70 transition-all hover:opacity-100 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Footer -->
                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end p-6 border-t border-gray-200">
                    <button @click="closeEditDialog"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        取消
                    </button>
                    <button @click="saveItemChanges"
                            :disabled="(!newTitle?.trim() && !newSection) || updating"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        <span x-show="!updating" class="flex items-center">
                            <i data-lucide="save" class="w-4 h-4 mr-2"></i>
                            保存
                        </span>
                        <span x-show="updating" class="flex items-center">
                            <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent mr-2"></div>
                            保存中...
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Dialog -->
        <div :class="{ 'dialog-hidden': !deleteDialogOpen, 'fixed inset-0 z-50': deleteDialogOpen }">
            <!-- Backdrop -->
            <div class="fixed inset-0 bg-black/50 z-40" @click="closeDeleteDialog"></div>

            <!-- Dialog -->
            <div class="fixed z-50 bg-white rounded-lg shadow-xl border border-gray-200"
                 style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(400px, 90vw);">
                <!-- Header -->
                <div class="pr-8 p-6 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">确认删除</h2>
                    <p class="text-sm text-gray-600 mt-1">
                        确定要删除条目 "<span class="font-medium text-gray-900" x-text="selectedItem?.title"></span>" 吗？
                    </p>
                </div>

                <!-- Content (empty for delete confirmation) -->
                <div class="p-6"></div>

                <!-- Close Button -->
                <button type="button" @click="closeDeleteDialog"
                        class="absolute top-4 right-4 rounded-sm text-gray-400 opacity-70 transition-all hover:opacity-100 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Footer -->
                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end p-6 border-t border-gray-200">
                    <button @click="closeDeleteDialog"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        取消
                    </button>
                    <button @click="deleteItem"
                            :disabled="deleting"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 disabled:bg-gray-300 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
                        <span x-show="!deleting" class="flex items-center">
                            <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>
                            删除
                        </span>
                        <span x-show="deleting" class="flex items-center">
                            <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent mr-2"></div>
                    </button>
                </div>
            </div>
        </div>

    <script>
        function datasetApp() {
            return {
                items: [],
                sections: [],
                filteredItems: [],
                searchResults: null,
                filters: {
                    search: '',
                    section: ''
                },
                currentPage: 1,
                pageSize: 20,
                dialogOpen: false,
                selectedItem: null,
                isSearching: false,
                searchDebounceTimer: null,
                deleteDialogOpen: false,
                deleting: false,
                editDialogOpen: false,
                editingItem: null,
                newTitle: '',
                newSection: '',
                updating: false,

                async init() {
                    // Read section from URL query parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const sectionParam = urlParams.get('section');
                    if (sectionParam) {
                        this.filters.section = decodeURIComponent(sectionParam);
                    }

                    await this.loadItems();
                    this.$nextTick(() => lucide.createIcons());

                    // Watch for page changes to refresh icons
                    this.$watch('currentPage', () => {
                        this.$nextTick(() => lucide.createIcons());
                    });
                },

                refreshIcons() {
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadItems() {
                    try {
                        const response = await fetch('/api/items');
                        this.items = await response.json();

                        // Extract unique sections
                        this.sections = [...new Set(this.items.map(item => item.section_name))].sort();
                        this.applyFilters();
                    } catch (error) {
                        console.error('Failed to load items:', error);
                    }
                },

                onSearchInput() {
                    // Clear previous timer
                    if (this.searchDebounceTimer) {
                        clearTimeout(this.searchDebounceTimer);
                    }

                    // Reset to all items if search is empty
                    if (!this.filters.search.trim()) {
                        this.searchResults = null;
                        this.applyFilters();
                        return;
                    }

                    // Debounce search
                    this.searchDebounceTimer = setTimeout(() => {
                        this.performSearch();
                    }, 500);
                },

                async performSearch() {
                    const query = this.filters.search.trim();
                    if (!query) {
                        this.searchResults = null;
                        this.applyFilters();
                        return;
                    }

                    this.isSearching = true;
                    try {
                        const sectionParam = this.filters.section ? `&section=${encodeURIComponent(this.filters.section)}` : '';
                        const response = await fetch(`/api/items/search?q=${encodeURIComponent(query)}${sectionParam}&limit=500`);
                        this.searchResults = await response.json();
                        this.applyFilters();
                    } catch (error) {
                        console.error('Search failed:', error);
                        this.searchResults = [];
                    } finally {
                        this.isSearching = false;
                    }
                },

                onSectionChange() {
                    // Re-perform search if there's a search query
                    if (this.filters.search.trim()) {
                        this.performSearch();
                    } else {
                        this.applyFilters();
                    }
                },

                applyFilters() {
                    // Use search results if available and search query exists
                    if (this.searchResults !== null && this.filters.search.trim()) {
                        this.filteredItems = this.searchResults;
                    } else {
                        // Filter all items by section only
                        this.filteredItems = this.items.filter(item => {
                            if (this.filters.section && item.section_name !== this.filters.section) {
                                return false;
                            }
                            return true;
                        });
                    }
                    this.currentPage = 1;
                    this.refreshIcons();
                },

                get paginatedItems() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.filteredItems.slice(start, start + this.pageSize);
                },

                get totalPages() {
                    return Math.ceil(this.filteredItems.length / this.pageSize);
                },

                get visiblePages() {
                    const total = this.totalPages;
                    const current = this.currentPage;
                    const delta = 2; // Number of pages to show on each side

                    if (total <= 7) {
                        // Show all pages if 7 or fewer
                        return Array.from({ length: total }, (_, i) => i + 1);
                    }

                    // Always show first page
                    const pages = [1];

                    if (current <= delta + 3) {
                        // Near the beginning
                        for (let i = 2; i <= Math.min(5, total - 1); i++) {
                            pages.push(i);
                        }
                        if (total > 5) {
                            pages.push('...');
                            pages.push(total);
                        }
                    } else if (current >= total - delta - 2) {
                        // Near the end
                        pages.push('...');
                        for (let i = Math.max(total - 4, 2); i <= total; i++) {
                            pages.push(i);
                        }
                    } else {
                        // In the middle
                        pages.push('...');
                        for (let i = current - delta; i <= current + delta; i++) {
                            pages.push(i);
                        }
                        pages.push('...');
                        pages.push(total);
                    }

                    return pages;
                },

                viewItem(item) {
                    this.selectedItem = item;
                    this.dialogOpen = true;
                },

                closeDialog() {
                    this.dialogOpen = false;
                    this.selectedItem = null;
                },

                confirmDeleteItem() {
                    this.deleteDialogOpen = true;
                },

                confirmDeleteItemFromList(item) {
                    this.selectedItem = item;
                    this.deleteDialogOpen = true;
                },

                closeDeleteDialog() {
                    this.deleteDialogOpen = false;
                },

                async deleteItem() {
                    if (!this.selectedItem) return;

                    this.deleting = true;

                    try {
                        const response = await fetch(`/api/items/${this.selectedItem.id}`, {
                            method: 'DELETE'
                        });

                        if (response.ok) {
                            this.closeDialog();
                            this.closeDeleteDialog();
                            await this.loadItems();
                        } else {
                            const result = await response.json();
                            alert('删除失败: ' + (result.error || '未知错误'));
                        }
                    } catch (error) {
                        alert('删除失败: ' + error.message);
                    } finally {
                        this.deleting = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                openEditDialog(item) {
                    console.log('Opening edit dialog for item:', item);
                    if (!item) {
                        console.error('Item is null or undefined');
                        return;
                    }
                    this.editingItem = item;
                    this.newTitle = item.title || '';
                    this.newSection = item.section_name || '';
                    this.editDialogOpen = true;
                    console.log('Edit dialog opened:', this.editDialogOpen, 'sections:', this.sections);
                },

                closeEditDialog() {
                    this.editDialogOpen = false;
                    this.editingItem = null;
                    this.newTitle = '';
                    this.newSection = '';
                },

                async saveItemChanges() {
                    if (!this.editingItem) return;

                    // Check if there are any changes
                    const titleChanged = this.newTitle.trim() && this.newTitle.trim() !== this.editingItem.title;
                    const sectionChanged = this.newSection && this.newSection !== this.editingItem.section_name;

                    if (!titleChanged && !sectionChanged) {
                        this.closeEditDialog();
                        return;
                    }

                    this.updating = true;

                    try {
                        // Update title if changed
                        if (titleChanged) {
                            const titleResponse = await fetch(`/api/items/${this.editingItem.id}/title`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ title: this.newTitle.trim() })
                            });

                            if (!titleResponse.ok) {
                                const result = await titleResponse.json();
                                alert('标题修改失败: ' + (result.error || '未知错误'));
                                return;
                            }
                        }

                        // Update section if changed
                        if (sectionChanged) {
                            const sectionResponse = await fetch(`/api/items/${this.editingItem.id}/section`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ section: this.newSection })
                            });

                            if (!sectionResponse.ok) {
                                const result = await sectionResponse.json();
                                alert('板块修改失败: ' + (result.error || '未知错误'));
                                return;
                            }
                        }

                        this.closeEditDialog();
                        await this.loadItems();
                    } catch (error) {
                        alert('修改失败: ' + error.message);
                    } finally {
                        this.updating = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                formatDateShort(dateStr) {
                    if (!dateStr) return '-';
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit'
                    });
                }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        // Close dialog on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const app = document.querySelector('[x-data]')._x_dataStack[0];
                if (app.editDialogOpen) {
                    app.closeEditDialog();
                } else if (app.deleteDialogOpen) {
                    app.closeDeleteDialog();
                } else if (app.dialogOpen) {
                    app.closeDialog();
                }
            }
        });
    </script>
</body>
</html>
