<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板块管理 - 科技爱好者周刊 RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="sectionApp()" x-cloak class="min-h-screen">
        <!-- Header -->
        <header class="bg-gray-900 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="book-open" class="w-8 h-8 text-blue-400"></i>
                        <h1 class="text-xl font-bold text-white">科技爱好者周刊 RAG</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>搜索</span>
                        </a>
                        <a href="/dataset" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="database" class="w-5 h-5"></i>
                            <span>数据集</span>
                        </a>
                        <a href="/articles" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                            <span>文章</span>
                        </a>
                        <a href="/dictionary" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="book" class="w-5 h-5"></i>
                            <span>词典</span>
                        </a>
                        <a href="/stopwords" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="filter" class="w-5 h-5"></i>
                            <span>停用词</span>
                        </a>
                        <a href="/section" class="text-blue-400 hover:text-blue-300 flex items-center space-x-1">
                            <i data-lucide="layout-grid" class="w-5 h-5"></i>
                            <span>板块</span>
                        </a>
                        <a href="/admin" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span>设置</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-6">
            <!-- Page Title -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">板块管理</h1>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                <div class="flex items-center space-x-4">
                    <label class="text-sm font-medium text-gray-700 whitespace-nowrap">搜索:</label>
                    <div class="relative flex-1 max-w-md">
                        <input type="text" x-model="filterSearch" @input="onFilterInput"
                               placeholder="输入关键词搜索板块名称..."
                               class="w-full h-9 px-3 pr-10 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors placeholder:text-gray-400">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                            <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <div x-show="filterSearch && filteredSections.length !== sections.length" class="mt-3 text-sm text-gray-600">
                    找到 <span class="font-medium text-blue-600" x-text="filteredSections.length"></span> 个板块
                </div>
            </div>

            <!-- Sections Grid -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <!-- Loading State -->
                <div x-show="loading" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-gray-300 border-t-blue-600"></div>
                    <p class="text-gray-600 mt-4">加载中...</p>
                </div>

                <!-- Empty State -->
                <div x-show="!loading && filteredSections.length === 0" class="text-center py-12">
                    <i data-lucide="layout-grid" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                    <h3 class="text-lg font-medium text-gray-900 mb-2" x-text="filterSearch ? '未找到匹配的板块' : '暂无板块'"></h3>
                    <p class="text-gray-500" x-text="filterSearch ? '请尝试其他关键词' : '数据库中还没有板块信息'"></p>
                </div>

                <!-- Sections Grid -->
                <div x-show="!loading && filteredSections.length > 0">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <template x-for="(section, index) in filteredSections" :key="section.name">
                            <div class="group relative bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 rounded-lg px-4 py-3 transition-colors">
                                <div class="flex items-center justify-between">
                                    <div class="flex-1 min-w-0">
                                        <span class="text-sm font-medium text-gray-900 block truncate" x-text="section.name"></span>
                                        <span class="text-xs text-gray-500" x-text="section.count + ' 个条目'"></span>
                                    </div>
                                    <!-- Edit Button -->
                                    <button @click="openEditDialog(section)"
                                            class="ml-2 p-1.5 bg-blue-100 hover:bg-blue-200 text-blue-600 rounded-md opacity-0 group-hover:opacity-100 transition-opacity focus:opacity-100 focus:outline-none">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="mt-4 text-sm text-gray-500">
                        共 <span x-text="filteredSections.length" class="font-semibold text-gray-900"></span> 个板块
                        <span x-show="filterSearch" class="text-gray-400">(筛选后)</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Edit Section Dialog -->
        <div x-show="showEditDialog" x-transition class="fixed inset-0 z-50" style="display: none;">
            <div class="fixed inset-0 bg-black/50" @click="closeEditDialog"></div>
            <div class="fixed z-50 bg-white rounded-lg shadow-xl flex flex-col border border-gray-200"
                 style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(500px, 90vw); max-height: 90vh;">
                <div class="p-6 overflow-y-auto">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">修改板块名称</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">当前板块</label>
                            <div class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-gray-900" x-text="editingSection?.name"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">新板块名称</label>
                            <input type="text"
                                   x-model="newSectionName"
                                   @keyup.enter="updateSection"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                   placeholder="输入新的板块名称"
                                   ref="sectionNameInput">
                            <p class="mt-2 text-xs text-gray-500">
                                此修改将应用到该板块下的所有 <span x-text="editingSection?.count" class="font-medium text-gray-900"></span> 个条目
                            </p>
                        </div>
                    </div>
                </div>
                <button type="button" @click="closeEditDialog"
                        class="absolute top-4 right-4 rounded-sm text-gray-400 opacity-70 transition-all hover:opacity-100 hover:text-gray-600 focus:outline-none cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end p-6 border-t border-gray-200">
                    <button @click="closeEditDialog"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        取消
                    </button>
                    <button @click="updateSection"
                            :disabled="!newSectionName.trim() || updating"
                            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        <span x-show="!updating" class="flex items-center">
                            <i data-lucide="save" class="w-4 h-4 mr-2"></i>
                            保存修改
                        </span>
                        <span x-show="updating" class="flex items-center">
                            <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent mr-2"></div>
                            保存中...
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div x-show="toast.show" x-transition class="fixed bottom-4 right-4 z-50">
            <div :class="toast.type === 'success' ? 'bg-green-500' : 'bg-red-500'" class="text-white px-6 py-3 rounded-lg shadow-lg">
                <div class="flex items-center space-x-2">
                    <i x-show="toast.type === 'success'" data-lucide="check-circle" class="w-5 h-5"></i>
                    <i x-show="toast.type === 'error'" data-lucide="alert-circle" class="w-5 h-5"></i>
                    <span x-text="toast.message"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sectionApp() {
            return {
                sections: [],
                filteredSections: [],
                loading: true,
                filterSearch: '',
                showEditDialog: false,
                editingSection: null,
                newSectionName: '',
                updating: false,
                toast: { show: false, message: '', type: 'success' },

                async init() {
                    await this.loadSections();
                    lucide.createIcons();
                },

                async loadSections() {
                    this.loading = true;
                    try {
                        const response = await fetch('/api/sections');
                        if (response.ok) {
                            this.sections = await response.json();
                            this.applyFilter();
                        } else {
                            this.showToast('加载板块失败', 'error');
                        }
                    } catch (error) {
                        this.showToast('加载板块失败: ' + error.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                onFilterInput() {
                    this.applyFilter();
                },

                applyFilter() {
                    if (!this.filterSearch.trim()) {
                        this.filteredSections = this.sections;
                    } else {
                        const search = this.filterSearch.toLowerCase();
                        this.filteredSections = this.sections.filter(section =>
                            section.name.toLowerCase().includes(search)
                        );
                    }
                },

                openEditDialog(section) {
                    this.editingSection = section;
                    this.newSectionName = section.name;
                    this.showEditDialog = true;
                    this.$nextTick(() => {
                        this.$refs.sectionNameInput?.focus();
                        this.$refs.sectionNameInput?.select();
                    });
                },

                closeEditDialog() {
                    this.showEditDialog = false;
                    this.editingSection = null;
                    this.newSectionName = '';
                },

                async updateSection() {
                    if (!this.newSectionName.trim() || !this.editingSection) return;

                    this.updating = true;

                    try {
                        const oldName = this.editingSection.name;
                        const newName = this.newSectionName.trim();

                        const response = await fetch('/api/sections/rename', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                old_name: oldName,
                                new_name: newName
                            })
                        });

                        const result = await response.json();

                        if (response.ok) {
                            this.showToast(`成功将 "${oldName}" 重命名为 "${newName}"，已更新 ${result.updated_count} 个条目`, 'success');
                            await this.loadSections();
                            this.closeEditDialog();
                        } else {
                            this.showToast(result.error || '修改失败', 'error');
                        }
                    } catch (error) {
                        this.showToast('修改失败: ' + error.message, 'error');
                    } finally {
                        this.updating = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => {
                        this.toast.show = false;
                    }, 3000);
                    this.$nextTick(() => lucide.createIcons());
                }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        // Close dialogs on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const app = document.querySelector('[x-data]')._x_dataStack[0];
                if (app && app.showEditDialog) {
                    app.closeEditDialog();
                }
            }
        });
    </script>
</body>
</html>
