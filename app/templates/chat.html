<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技爱好者周刊 RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .markdown-content h1 { font-size: 1.5rem; }
        .markdown-content h2 { font-size: 1.25rem; }
        .markdown-content h3 { font-size: 1.1rem; }
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content code { background: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .markdown-content pre { background: #1f2937; color: #f9fafb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
        .markdown-content pre code { background: transparent; color: inherit; }
        .markdown-content blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; margin: 0.75rem 0; color: #6b7280; }
        .markdown-content a { color: #2563eb; text-decoration: underline; }
        .markdown-content table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; }
        .markdown-content th, .markdown-content td { border: 1px solid #e5e7eb; padding: 0.5rem; }
        .markdown-content th { background: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="chatApp()" x-cloak class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-900 border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="book-open" class="w-8 h-8 text-blue-400"></i>
                        <a href="/" class="text-xl font-bold text-white hover:text-blue-300 transition-colors">OhMyAgent-Wiki</a>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-blue-400 hover:text-blue-300 flex items-center space-x-1">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>Chat</span>
                        </a>
                        <a href="/dataset" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="database" class="w-5 h-5"></i>
                            <span>Dataset</span>
                        </a>
                        <a href="/articles" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                            <span>Article</span>
                        </a>
                        <a href="/dictionary" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="book" class="w-5 h-5"></i>
                            <span>Keyword</span>
                        </a>
                        <a href="/stopwords" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="filter" class="w-5 h-5"></i>
                            <span>StopWord</span>
                        </a>
                        <a href="/section" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="layout-grid" class="w-5 h-5"></i>
                            <span>Section</span>
                        </a>
                        <a href="/admin" class="text-gray-300 hover:text-white flex items-center space-x-1">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span>Admin Panel</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6">
            <!-- Empty State -->
            <div x-show="!result && !loading" class="text-center py-12">
                <i data-lucide="search" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">开始搜索</h3>
                <p class="text-gray-500">输入问题，从阮一峰科技爱好者周刊中找到答案</p>
            </div>

            <!-- Search Input Bar -->
            <div class="max-w-2xl mx-auto mb-6">
                <form @submit.prevent="submitQuery" class="flex items-center space-x-3">
                    <input
                        type="text"
                        x-model="query"
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                        placeholder="输入问题，从阮一峰科技爱好者周刊中找到答案..."
                        :disabled="loading"
                        @keyup.enter="submitQuery"
                    >
                    <button
                        type="submit"
                        :disabled="loading || !query.trim()"
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center space-x-2"
                    >
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span>搜</span>
                    </button>
                </form>
            </div>

            <!-- Loading State -->
            <div x-show="loading" class="text-center py-12">
                <div class="space-y-2">
                    <p class="text-lg font-medium text-gray-700">可信AI，有依据，才可信！</p>
                    <p class="text-gray-500 font-mono">Thinking<span x-text="loadingDots"></span></p>
                </div>
            </div>

            <!-- Results -->
            <div x-show="result || timeline.length > 0" class="space-y-6">
                <!-- Timeline (shows during loading) -->
                <div x-show="timeline.length > 0" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="clock" class="w-5 h-5 text-purple-600"></i>
                        <span>实时处理进度</span>
                    </h2>

                    <!-- Timeline -->
                    <div>
                        <button
                            @click="showTimeline = !showTimeline"
                            class="flex items-center space-x-2 text-sm text-gray-600 mb-2 w-full text-left hover:text-gray-800 transition-colors"
                        >
                            <i data-lucide="history" class="w-4 h-4"></i>
                            <span>处理时间线 (<span x-text="timeline.length"></span> 步)</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 ml-auto transition-transform" :class="{'rotate-180': showTimeline}"></i>
                        </button>

                        <div x-show="showTimeline" class="space-y-2 ml-6" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
                            <template x-for="(event, index) in timeline" :key="index">
                                <div class="relative pl-6 pb-4 border-l-2 border-gray-200 last:pb-0">
                                    <div class="absolute -left-2 top-0 w-4 h-4 rounded-full border-2 border-white"
                                         :class="{
                                             'bg-blue-500': event.type === 'search',
                                             'bg-yellow-500': event.type === 'think',
                                             'bg-purple-500': event.type === 'rewrite',
                                             'bg-green-500': event.type === 'answer',
                                             'bg-red-500': event.type === 'error'
                                         }">
                                    </div>

                                    <div class="text-sm">
                                        <div x-show="event.type === 'search'" class="bg-gray-50 rounded p-2">
                                            <div class="flex items-center justify-between">
                                                <div class="font-medium text-gray-700 flex items-center space-x-1">
                                                    <i data-lucide="search" class="w-3 h-3"></i>
                                                    <span>搜索</span>
                                                </div>
                                                <span class="text-xs text-gray-400" x-text="formatTime(event.timestamp)"></span>
                                            </div>
                                            <div x-show="event.tokenizedQuery" class="mt-2">
                                                <div class="text-xs text-gray-500 mb-1">搜索关键词 (jieba分词):</div>
                                                <div class="bg-white rounded px-2 py-1">
                                                    <code class="text-xs text-blue-700" x-text="event.tokenizedQuery"></code>
                                                </div>
                                            </div>
                                            <div x-show="event.status === 'complete'" class="text-gray-500 text-xs mt-1">
                                                找到 <span class="font-medium text-gray-700" x-text="event.resultsCount"></span> 条结果
                                            </div>
                                            <div x-show="event.status === 'start'" class="text-gray-400 text-xs mt-1">
                                                正在搜索...
                                            </div>
                                        </div>

                                        <div x-show="event.type === 'think'" class="bg-yellow-50 rounded p-2">
                                            <div class="flex items-center justify-between mb-1">
                                                <div class="font-medium text-gray-700 flex items-center space-x-1">
                                                    <i data-lucide="brain" class="w-3 h-3"></i>
                                                    <span>思考</span>
                                                    <span class="text-gray-400 text-xs">Round <span x-text="event.iteration"></span></span>
                                                </div>
                                                <span class="text-xs text-gray-400" x-text="formatTime(event.timestamp)"></span>
                                            </div>
                                            <div class="text-gray-600 text-xs mt-1 leading-relaxed" x-text="event.reasoning"></div>
                                            <div class="mt-2">
                                                <span class="px-2 py-0.5 rounded text-xs font-medium"
                                                      :class="event.decision === 'CONTINUE' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'"
                                                      x-text="event.decision">
                                                </span>
                                            </div>
                                            <div x-show="event.improvedQuery && event.decision === 'CONTINUE'" class="mt-2">
                                                <div class="text-xs text-gray-500 mb-1">优化后的搜索关键词:</div>
                                                <div class="bg-white rounded px-2 py-1">
                                                    <code class="text-xs text-purple-700" x-text="event.improvedQuery"></code>
                                                </div>
                                            </div>
                                        </div>

                                        <div x-show="event.type === 'rewrite'" class="bg-purple-50 rounded p-2">
                                            <div class="flex items-center justify-between mb-1">
                                                <div class="font-medium text-gray-700 flex items-center space-x-1">
                                                    <i data-lucide="edit-3" class="w-3 h-3"></i>
                                                    <span>查询重写</span>
                                                    <span class="text-gray-400 text-xs">Round <span x-text="event.iteration"></span></span>
                                                </div>
                                                <span class="text-xs text-gray-400" x-text="formatTime(event.timestamp)"></span>
                                            </div>
                                            <div class="bg-white rounded px-2 py-1 mt-1">
                                                <code class="text-xs text-purple-700" x-text="event.newQuery"></code>
                                            </div>
                                        </div>

                                        <div x-show="event.type === 'answer'" class="bg-green-50 rounded p-2">
                                            <div class="flex items-center justify-between">
                                                <div class="font-medium text-green-700 flex items-center space-x-1">
                                                    <i data-lucide="check-circle" class="w-3 h-3"></i>
                                                    <span>完成</span>
                                                </div>
                                                <span class="text-xs text-gray-400" x-text="formatTime(event.timestamp)"></span>
                                            </div>
                                        </div>

                                        <div x-show="event.type === 'error'" class="bg-red-50 rounded p-2">
                                            <div class="flex items-center justify-between mb-1">
                                                <div class="font-medium text-red-700 flex items-center space-x-1">
                                                    <i data-lucide="alert-circle" class="w-3 h-3"></i>
                                                    <span>错误</span>
                                                </div>
                                                <span class="text-xs text-gray-400" x-text="formatTime(event.timestamp)"></span>
                                            </div>
                                            <div class="text-red-600 text-xs" x-text="event.message"></div>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div x-show="timeline.length === 0" class="text-center py-4 text-gray-400 text-sm">
                                等待查询开始...
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Answer -->
                <div x-show="result?.answer" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="message-square" class="w-5 h-5 text-green-600"></i>
                        <span>AI 回答</span>
                    </h2>
                    <div class="prose prose-sm max-w-none">
                        <div class="markdown-content" x-html="marked.parse(cleanAnswer || '')"></div>
                    </div>
                </div>

                <!-- RAG Process Tracker -->
                <div x-show="result" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="workflow" class="w-5 h-5 text-blue-600"></i>
                        <span>信息溯源</span>
                    </h2>

                    <!-- Sources -->
                    <div>
                        <div class="flex items-center space-x-2 text-sm text-gray-600 mb-2">
                            <i data-lucide="database" class="w-4 h-4"></i>
                            <span>引用来源 (<span x-text="result?.sources?.length || 0"></span> 条)</span>
                        </div>
                        <div class="space-y-2">
                            <template x-for="(source, index) in result?.sources || []" :key="index">
                                <a :href="source" target="_blank" class="block bg-gray-50 rounded-lg p-3 hover:bg-gray-100 transition-colors">
                                    <div class="flex items-center space-x-2 text-sm">
                                        <i data-lucide="external-link" class="w-3 h-3 text-gray-400"></i>
                                        <span class="text-gray-700 truncate" x-text="source"></span>
                                    </div>
                                </a>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-gray-200">
            <div class="max-w-4xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
                基于 SQLite FTS5 + jieba + LangGraph 的 RAG 系统
            </div>
        </footer>
    </div>

    <script>
        // Make marked available globally for Alpine.js
        window.marked = marked;

        function chatApp() {
            return {
                query: '',
                loading: false,
                loadingDots: '',
                result: null,
                dotsInterval: null,

                // Timeline state
                timeline: [],
                showTimeline: false,

                get cleanAnswer() {
                    return this.result?.answer || '';
                },

                startLoadingAnimation() {
                    this.loadingDots = '.';
                    let dotCount = 1;
                    this.dotsInterval = setInterval(() => {
                        dotCount = dotCount % 3 + 1;
                        this.loadingDots = '.'.repeat(dotCount);
                    }, 500);
                },

                stopLoadingAnimation() {
                    if (this.dotsInterval) {
                        clearInterval(this.dotsInterval);
                        this.dotsInterval = null;
                    }
                    this.loadingDots = '';
                },

                formatTime(timestamp) {
                    if (!timestamp) return '';
                    const date = new Date(timestamp);
                    return date.toLocaleTimeString('zh-CN', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                },

                async submitQuery() {
                    if (!this.query.trim()) return;

                    this.loading = true;
                    this.result = null;
                    this.timeline = [];
                    this.startLoadingAnimation();

                    try {
                        const response = await fetch('/api/query/stream', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ query: this.query })
                        });

                        if (!response.ok) {
                            throw new Error('搜索失败');
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });

                            const lines = buffer.split('\n\n');
                            buffer = lines.pop();

                            for (const line of lines) {
                                if (!line.trim()) continue;

                                const lines_list = line.split('\n');
                                let eventType = 'message';
                                let data = {};

                                for (const l of lines_list) {
                                    if (l.startsWith('event: ')) {
                                        eventType = l.substring(7);
                                    } else if (l.startsWith('data: ')) {
                                        try {
                                            data = JSON.parse(l.substring(6));
                                        } catch (e) {
                                            console.error('Failed to parse SSE data:', l);
                                        }
                                    }
                                }

                                this.handleSSEEvent(eventType, data);
                            }
                        }

                    } catch (error) {
                        console.error('Error:', error);

                        this.timeline.push({
                            type: 'error',
                            message: error.message,
                            timestamp: new Date()
                        });

                        alert('搜索失败: ' + error.message);
                    } finally {
                        this.loading = false;
                        this.stopLoadingAnimation();
                        lucide.createIcons();
                    }
                },

                handleSSEEvent(eventType, data) {
                    const timestamp = new Date();

                    // Auto-expand timeline on first event
                    if (this.timeline.length === 0) {
                        this.showTimeline = true;
                    }

                    switch (eventType) {
                        case 'search_start':
                            this.timeline.push({
                                type: 'search',
                                status: 'start',
                                iteration: data.iteration || 1,
                                query: data.query,
                                timestamp
                            });
                            break;

                        case 'search_complete':
                            // Find and update the corresponding search_start event
                            const lastSearch = this.timeline.findLast(t => t.type === 'search' && t.status === 'start');
                            if (lastSearch) {
                                lastSearch.status = 'complete';
                                lastSearch.resultsCount = data.results_count;
                                lastSearch.tokenizedQuery = data.tokenized_query;
                                lastSearch.query = data.query;
                                lastSearch.isOriginalSearch = data.is_original_search || false;
                            }
                            break;

                        case 'think_complete':
                            this.timeline.push({
                                type: 'think',
                                iteration: data.iteration,
                                reasoning: data.reasoning,
                                decision: data.decision,
                                improvedQuery: data.improved_query || '',
                                timestamp
                            });
                            break;

                        case 'rewrite_complete':
                            this.timeline.push({
                                type: 'rewrite',
                                iteration: data.iteration,
                                newQuery: data.new_query,
                                timestamp
                            });
                            break;

                        case 'answer_complete':
                            this.result = {
                                answer: data.answer,
                                sources: data.sources,
                                loop_count: data.total_iterations
                            };
                            break;

                        case 'error':
                            this.timeline.push({
                                type: 'error',
                                message: data.error,
                                timestamp
                            });
                            this.loading = false;
                            this.stopLoadingAnimation();
                            break;
                    }
                }
            };
        }

        // Initialize icons
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
