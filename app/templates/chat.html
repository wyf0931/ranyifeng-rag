<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技爱好者周刊 RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .markdown-content h1 { font-size: 1.5rem; }
        .markdown-content h2 { font-size: 1.25rem; }
        .markdown-content h3 { font-size: 1.1rem; }
        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content ul, .markdown-content ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content code { background: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .markdown-content pre { background: #1f2937; color: #f9fafb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
        .markdown-content pre code { background: transparent; color: inherit; }
        .markdown-content blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; margin: 0.75rem 0; color: #6b7280; }
        .markdown-content a { color: #2563eb; text-decoration: underline; }
        .markdown-content table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; }
        .markdown-content th, .markdown-content td { border: 1px solid #e5e7eb; padding: 0.5rem; }
        .markdown-content th { background: #f9fafb; }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="chatApp()" x-cloak class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="book-open" class="w-8 h-8 text-blue-600"></i>
                        <h1 class="text-xl font-bold text-gray-900">科技爱好者周刊 RAG</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-blue-600 hover:text-blue-800 flex items-center space-x-1">
                            <i data-lucide="search" class="w-5 h-5"></i>
                            <span>搜索</span>
                        </a>
                        <a href="/dataset" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="database" class="w-5 h-5"></i>
                            <span>数据集</span>
                        </a>
                        <a href="/dictionary" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="book" class="w-5 h-5"></i>
                            <span>词典</span>
                        </a>
                        <a href="/stopwords" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="filter" class="w-5 h-5"></i>
                            <span>停用词</span>
                        </a>
                        <a href="/admin" class="text-gray-600 hover:text-gray-900 flex items-center space-x-1">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                            <span>设置</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6">
            <!-- Search Input Bar -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                <form @submit.prevent="submitQuery" class="flex items-center space-x-3">
                    <input
                        type="text"
                        x-model="query"
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                        placeholder="输入问题，从阮一峰科技爱好者周刊中找到答案..."
                        :disabled="loading"
                        @keyup.enter="submitQuery"
                    >
                    <button
                        type="submit"
                        :disabled="loading || !query.trim()"
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center space-x-2"
                    >
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span>搜</span>
                    </button>
                </form>
            </div>

            <!-- Results -->
            <div x-show="result" class="space-y-6">
                <!-- RAG Process Tracker -->
                <div x-show="result" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="workflow" class="w-5 h-5 text-blue-600"></i>
                        <span>RAG 处理流程</span>
                    </h2>

                    <!-- Query Rewrite -->
                    <div class="mb-4">
                        <div class="flex items-center space-x-2 text-sm text-gray-600 mb-2">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                            <span>查询重写</span>
                        </div>
                        <div class="bg-blue-50 rounded-lg p-3">
                            <p class="text-sm text-gray-700" x-text="result?.rewritten_query || '使用原始查询'"></p>
                        </div>
                    </div>

                    <!-- Thinking -->
                    <div class="mb-4">
                        <div class="flex items-center space-x-2 text-sm text-gray-600 mb-2">
                            <i data-lucide="brain" class="w-4 h-4"></i>
                            <span>思考过程 (循环次数: <span x-text="result?.loop_count || 0"></span>)</span>
                        </div>
                        <div class="bg-yellow-50 rounded-lg p-3">
                            <p class="text-sm text-gray-700" x-text="result?.thinking || '分析搜索结果...'"></p>
                        </div>
                    </div>

                    <!-- Sources -->
                    <div>
                        <div class="flex items-center space-x-2 text-sm text-gray-600 mb-2">
                            <i data-lucide="database" class="w-4 h-4"></i>
                            <span>引用来源 (<span x-text="result?.sources?.length || 0"></span> 条)</span>
                        </div>
                        <div class="space-y-2">
                            <template x-for="(source, index) in result?.sources || []" :key="index">
                                <a :href="source" target="_blank" class="block bg-gray-50 rounded-lg p-3 hover:bg-gray-100 transition-colors">
                                    <div class="flex items-center space-x-2 text-sm">
                                        <i data-lucide="external-link" class="w-3 h-3 text-gray-400"></i>
                                        <span class="text-gray-700 truncate" x-text="source"></span>
                                    </div>
                                </a>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Answer -->
                <div x-show="result?.answer" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center space-x-2">
                        <i data-lucide="message-square" class="w-5 h-5 text-green-600"></i>
                        <span>AI 回答</span>
                    </h2>
                    <div class="prose prose-sm max-w-none">
                        <div class="markdown-content" x-html="marked.parse(cleanAnswer || '')"></div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div x-show="!result && !loading" class="text-center py-12">
                <i data-lucide="search" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">开始搜索</h3>
                <p class="text-gray-500">输入问题，从阮一峰科技爱好者周刊中找到答案</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-gray-200">
            <div class="max-w-4xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
                基于 SQLite FTS5 + jieba + LangGraph 的 RAG 系统
            </div>
        </footer>
    </div>

    <script>
        // Make marked available globally for Alpine.js
        window.marked = marked;

        // Clean markdown formatting issues
        function cleanMarkdown(text) {
            if (!text) return '';
            // Fix bold formatting with spaces/punctuation around **
            // Convert ** "text" ** to **"text"**
            text = text.replace(/\*\*\s+([^\s*])/, '**$1');  // Remove space after opening **
            text = text.replace(/([^\s*])\s+\*\*/, '$1**');  // Remove space before closing **
            // Fix ** "text" ** style
            text = text.replace(/\*\*\s+"([^"]+)"\s+\*\*/g, '**"$1"**');
            text = text.replace(/\*\*\s+'([^']+)'\s+\*\*/g, "**'$1'**");
            return text;
        }

        function chatApp() {
            return {
                query: '',
                loading: false,
                result: null,

                get cleanAnswer() {
                    if (!this.result?.answer) return '';
                    return cleanMarkdown(this.result.answer);
                },

                async submitQuery() {
                    if (!this.query.trim()) return;

                    this.loading = true;
                    this.result = null;

                    try {
                        const response = await fetch('/api/query', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ query: this.query })
                        });

                        if (!response.ok) {
                            throw new Error('搜索失败');
                        }

                        this.result = await response.json();
                    } catch (error) {
                        console.error('Error:', error);
                        alert('搜索失败: ' + error.message);
                    } finally {
                        this.loading = false;
                        lucide.createIcons();
                    }
                }
            };
        }

        // Initialize icons
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
